# Conda environment `neurofly` for x86_64 Linux (WSL2 Ubuntu 24.04, RTX 4070 Laptop; torch CUDA 13.0 wheels).
# Generated with `conda env export -n neurofly --no-builds` from the working environment of 2026-10-16; the only
# change is flybody, which is not here: it pins numpy==1.26.4 and is installed with --no-deps from
# env/neurofly_x86_64_nodeps.txt (as on the aarch64 M1 machine, which also ran it with numpy 2.0.2).
# The pip section equals the `pip freeze` of the M1 environment (ENV.txt of the transfer); conda packages are the
# same except ld_impl_linux-64 for ld_impl_linux-aarch64. Rebuild: bash env/create_neurofly.sh
